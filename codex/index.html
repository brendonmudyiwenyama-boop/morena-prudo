<!DOCTYPE html>
<html lang="en"><head>
<meta name="theme-color" content="#2a0d08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Codex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="config.js?v=202611201249"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js?v=202611201249"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Arjuun Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900;1,6..12,600&display=swap">
<style>
/* Layout: phone-first single column. Sticky masthead (ravens, codex title, week moon) over a ribbon of bookmark tabs.
   Palette: parchment and iron-gall ink by day, a candlelit scriptorium by night. Vermilion rubrics, gold leaf, verdigris, lapis. */
:root{
  --bg:#efe6d2; --page:#f6eedb; --page-2:#eadfc4; --edge:#cdb893; --ink:#33231a; --ink-2:#6f5b45;
  --verm:#94402a; --gold:#8f6a2a; --gold-soft:#ecdcb3; --verd:#4a6a55; --lapis:#4a5a80; --plum:#6d4459; --umber:#7a5634;
  --raven:#1d1a26; --eye:#d9a520; --ok:#4f6b4b; --late:#94402a; --soon:#8f6a2a;
  --f-cap:"Avenir Next","Avenir","Nunito Sans",system-ui,sans-serif; --f-head:"Avenir Next","Avenir","Nunito Sans",system-ui,sans-serif; --f-body:"Avenir Next","Avenir","Nunito Sans",system-ui,sans-serif; --f-deco:"Cinzel",Georgia,serif;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13100f; --page:#1d1916; --page-2:#27211c; --edge:#3d342b; --ink:#eadcc0; --ink-2:#b4a58a;
  --verm:#cf7a5f; --gold:#cfa257; --gold-soft:#3a2d18; --verd:#86ab92; --lapis:#9aa7c6; --plum:#c3939f; --umber:#c79b6c;
  --raven:#2c2738; --eye:#ffcf4a; --ok:#93b08a; --late:#cf7a5f; --soon:#cfa257;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:500 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:660px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
main.wrap{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums lining-nums}

/* masthead */
.mast{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--edge)}
.mast-row{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.ravens{flex:none;border:none;background:none;padding:0;position:relative}
.ravens svg{overflow:visible}
.ravens .pip{position:absolute;right:-2px;top:2px;min-width:18px;height:18px;border-radius:9px;background:var(--verm);color:#fff;font:700 11px var(--f-body);display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.title{flex:1;min-width:0}
.title h1{font:800 21px/1.1 var(--f-head);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .sub{font:600 10.5px var(--f-cap);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.title .sub2{font-size:12px;color:var(--ink-2)}
.moonbox{flex:none;text-align:center;border:none;background:none;padding:0}
.moonbox svg{width:46px;height:46px;display:block;margin:0 auto;overflow:visible}
.mglow{animation:mGlow 4s ease-in-out infinite;transform-origin:23px 23px}@keyframes mGlow{0%,100%{opacity:.7}50%{opacity:1}}
.moonbox span{display:block;font:600 9.5px var(--f-cap);letter-spacing:.1em;color:var(--ink-2);margin-top:2px}

/* ribbons */
.ribbons{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
.ribbons::-webkit-scrollbar{display:none}
.ribbons button{flex:1 0 auto;min-width:64px;border:1px solid var(--edge);border-bottom:none;background:var(--page-2);padding:7px 10px 9px;font:600 11.5px var(--f-cap);letter-spacing:.08em;color:var(--ink-2);border-radius:6px 6px 0 0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.ribbons button svg{width:18px;height:18px}
.ribbons button[aria-selected="true"]{background:var(--page);color:var(--verm);transform:translateY(1px)}
.ribbons button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:-11px;width:12px;height:12px;margin-left:-6px;background:var(--verm);clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}

/* pages */
.panel{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.folio{background:var(--page);border:1px solid var(--edge);border-radius:var(--r);padding:16px;position:relative;box-shadow:0 1px 0 var(--edge),0 8px 22px -16px rgba(40,25,10,.35)}
.folio.gilt{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--page),inset 0 0 0 4px color-mix(in srgb,var(--gold) 55%,transparent),0 8px 22px -16px rgba(40,25,10,.35)}
.rubric{font:800 10.5px var(--f-cap);letter-spacing:.16em;text-transform:uppercase;color:var(--verm)}
.h2{font:800 21px/1.2 var(--f-head);letter-spacing:-.01em}
.h3{font:800 17px/1.25 var(--f-head)}
.muted{color:var(--ink-2);font-size:13px}
.small{font-size:12.5px}
p{margin:6px 0}
.drop::first-letter{float:left;font:700 44px/.85 var(--f-deco);color:var(--verm);padding:4px 6px 0 0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapgap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.rule{height:1px;background:var(--edge);margin:12px 0;border:none}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--f-cap);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:2px 8px;white-space:nowrap}
.chip.late{color:var(--late)} .chip.soon{color:var(--soon)} .chip.ok{color:var(--ok)} .chip.lapis{color:var(--lapis)} .chip.plum{color:var(--plum)} .chip.dim{color:var(--ink-2)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--page);border-radius:4px;padding:9px 14px;font:600 13px var(--f-body);display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn.verm{background:var(--verm);border-color:var(--verm);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:4px;background:var(--bg)}
.inp.n{width:90px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.track{height:6px;border-radius:3px;background:var(--page-2);overflow:hidden}
.track>i{display:block;height:100%;background:var(--c,var(--gold));border-radius:3px;transition:width .5s}
a{color:var(--lapis)}
details>summary{cursor:pointer;font-weight:600;list-style:none}
details>summary::before{content:"❧ ";color:var(--verm)}
details[open]>summary::before{content:"☙ "}

/* raven letter */
.letter{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start}
.letter svg{width:54px;height:54px}
.scroll{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:4px 14px 14px 14px;padding:10px 12px;position:relative}
.scroll::before{content:"";position:absolute;left:-8px;top:12px;border:8px solid transparent;border-right-color:color-mix(in srgb,var(--gold) 45%,transparent);border-left:0}
.letter.fly svg{animation:fly .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes fly{from{transform:translate(-60px,-30px) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}

/* due list */
.due{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px dashed var(--edge)}
.due:first-child{border-top:none}
.due .glyph{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.due .glyph svg{width:20px;height:20px}
.due b{display:block;font-weight:600;line-height:1.3}
.due span{font-size:12.5px;color:var(--ink-2)}

/* seals */
.seals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.seal{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.seal svg{width:44px;height:44px}
.seal b{font:600 10px var(--f-cap);letter-spacing:.06em}
.seal span{font-size:11px;color:var(--ink-2)}
.seal.met svg{animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:scale(1.5) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* quick ink */
.inks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ink{border:1px solid var(--edge);background:var(--page);border-radius:4px;padding:10px;text-align:left;display:grid;grid-template-columns:26px 1fr;gap:2px 8px;align-items:center;position:relative;overflow:hidden}
.ink svg{width:24px;height:24px;color:var(--c);grid-row:span 2}
.ink b{font-size:13px;line-height:1.2}
.ink span{font-size:11.5px;color:var(--ink-2)}
.ink.blot::after{content:"";position:absolute;left:var(--x,50%);top:var(--y,50%);width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--c);opacity:.35;animation:blot .7s ease-out forwards}
@keyframes blot{to{transform:scale(28);opacity:0}}

/* mastery */
.mast-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.mrow{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:center}
.mrow svg{width:26px;height:26px;color:var(--c);grid-row:span 2}
.mrow .track{grid-column:2/4}
.mrow b{font-family:var(--f-head);font-weight:800;font-size:16px}
.mrow em{font-style:normal;font-size:12px;color:var(--ink-2)}

/* shelf */
.shelf{display:flex;align-items:flex-end;gap:2px;min-height:76px;padding:0 6px;border-bottom:6px solid var(--umber);border-radius:0 0 3px 3px;margin-top:10px;overflow-x:auto}
.spine{flex:none;width:12px;border-radius:2px 2px 0 0;background:var(--c);position:relative;box-shadow:inset -2px 0 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.12)}
.spine::after{content:"";position:absolute;left:2px;right:2px;top:7px;height:2px;background:color-mix(in srgb,var(--gold) 80%,#fff)}
.spine.new{animation:slideIn .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes slideIn{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.shelf .empty{font-size:12.5px;color:var(--ink-2);padding-bottom:8px}

/* hourglass ring */
.cad{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.cad svg{width:96px;height:96px}
.cad .big{font:800 28px/1.1 var(--f-head);letter-spacing:-.02em}
.ints{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ints button{border:1px solid var(--edge);background:transparent;border-radius:99px;padding:3px 10px;font-size:12px}
.ints button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}

/* forms atlas */
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fcard{border:1px solid var(--edge);border-radius:4px;background:var(--page);padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.fcard b{font:800 15px var(--f-head)}
.fcard span{font-size:11.5px;color:var(--ink-2)}
.fcard .wax{position:absolute;right:8px;top:8px;width:20px;height:20px}
.fcard[aria-pressed="true"]{border-color:var(--verm);box-shadow:0 0 0 1px var(--verm)}
.loom{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}
.loom i{font:700 11px var(--f-body);font-style:normal;width:22px;height:22px;border-radius:3px;display:grid;place-items:center;color:#fff}
.loom i.gap{width:8px;background:none!important}
.loom i.ref{outline:2px solid var(--ink);outline-offset:-2px}
.lm-A{background:#b0362a}.lm-B{background:#2e4b8f}.lm-C{background:#2c7a68}.lm-D{background:#a97a1f}.lm-E{background:#7a3b6e}.lm-F{background:#8a5a2b}.lm-G{background:#3f6f2a}.lm-x{background:#8b8394}
ul.rules{margin:6px 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pad{width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--edge);border-radius:4px;background:var(--bg);font:15px/1.7 var(--f-body);resize:vertical}
.lines{font-size:12.5px;display:flex;flex-direction:column;gap:2px;margin-top:8px;max-height:280px;overflow:auto}
.lines div{display:grid;grid-template-columns:18px 22px 1fr 40px 26px;gap:6px;align-items:center}
.lines em{font-style:normal;color:var(--ink-2)}
.lines .bad{color:var(--late);font-weight:700}
.lines .good{color:var(--ok);font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* tales */
.tale{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;padding-block:10px;border-top:1px dashed var(--edge)}
.tale:first-child{border-top:none}
.tale .tick{width:28px;height:28px;border:1.5px solid var(--edge);border-radius:50%;background:transparent;display:grid;place-items:center;margin-top:2px}
.tale .tick svg{width:16px;height:16px;opacity:0}
.tale.read .tick{background:var(--verd);border-color:var(--verd);color:#fff}
.tale.read .tick svg{opacity:1}
.tale.read b{text-decoration:line-through;text-decoration-color:var(--ink-2)}
.tale b{font-weight:600}
.tale .meta{font-size:12px;color:var(--ink-2)}
.tale .why{font-size:12.5px;color:var(--ink-2);font-style:italic;grid-column:2/4}
.tale .x{border:none;background:none;color:var(--ink-2);font-size:18px;line-height:1;padding:2px 4px}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px}
.pipeline div{text-align:center;font:600 9.5px var(--f-cap);letter-spacing:.05em;padding:6px 2px;border-radius:3px;background:var(--page-2);color:var(--ink-2)}
.pipeline div.done{background:var(--verd);color:#fff}
.pipeline div.cur{background:var(--gold);color:#fff}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dots i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--edge);display:grid;place-items:center;font:600 10px var(--f-body);font-style:normal;color:var(--ink-2)}
.dots i.on{background:var(--plum);border-color:var(--plum);color:#fff}

/* novels */
.ms{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding-block:8px;border-top:1px dashed var(--edge)}
.ms:first-of-type{border-top:none}
.box{width:24px;height:24px;border:1.5px solid var(--edge);border-radius:4px;background:transparent;display:grid;place-items:center;margin-top:1px}
.box svg{width:15px;height:15px;opacity:0}
.ms.done .box,.rp.done .box{background:var(--c);border-color:var(--c);color:#fff}
.ms.done .box svg,.rp.done .box svg{opacity:1}
.ms.done b{color:var(--ink-2);text-decoration:line-through}
.ms b{font-weight:600;font-size:14px;line-height:1.35}
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
.phase div{border-radius:3px;padding:6px;text-align:center;font:600 10px var(--f-cap);letter-spacing:.06em;background:var(--page-2);color:var(--ink-2)}
.phase div.on{background:var(--c);color:#fff}
.phase div.past{background:color-mix(in srgb,var(--c) 30%,var(--page-2));color:var(--ink)}
.rp{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding-block:5px;font-size:13.5px}

/* studio */
.path{display:flex;flex-direction:column;gap:0;margin-top:8px}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 0;position:relative}
.step::before{content:"";position:absolute;left:12px;top:-6px;bottom:50%;width:2px;background:var(--edge)}
.step:first-child::before{display:none}
.step .nd{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);background:var(--page);display:grid;place-items:center;font:700 11px var(--f-body);position:relative;z-index:1}
.step.done .nd{background:var(--c);border-color:var(--c);color:#fff}
.step.cur .nd{border-color:var(--c);color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.step.lock{opacity:.55}
.step b{font-size:14px;font-weight:600}

/* parchment texture (Canva) */
:root{--parch:url("art/parch_tile.webp")}
body{background-color:var(--bg);background-image:var(--parch);background-size:560px 560px}
@media (prefers-color-scheme:dark){body{background-image:linear-gradient(rgba(17,15,23,.9),rgba(17,15,23,.9)),var(--parch);background-size:auto,560px 560px}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 120px rgba(90,55,20,.32)}
@media (prefers-color-scheme:dark){body::before{box-shadow:inset 0 0 140px rgba(0,0,0,.6)}}
main,header{position:relative;z-index:1}
.mast{z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent)}
.folio{background-color:var(--page);background-image:linear-gradient(color-mix(in srgb,var(--page) 62%,transparent),color-mix(in srgb,var(--page) 62%,transparent)),var(--parch);background-size:auto,560px 560px;border-radius:7px 5px 8px 4px/5px 8px 4px 7px;box-shadow:inset 0 0 28px rgba(140,90,30,.18),0 1px 0 var(--edge),0 10px 24px -16px rgba(40,25,10,.4)}
@media (prefers-color-scheme:dark){.folio{background-image:linear-gradient(color-mix(in srgb,var(--page) 93%,transparent),color-mix(in srgb,var(--page) 93%,transparent)),var(--parch);box-shadow:inset 0 0 30px rgba(0,0,0,.45),0 1px 0 var(--edge),0 10px 24px -16px rgba(0,0,0,.6)}}
.folio.gilt{box-shadow:inset 0 0 0 3px transparent,inset 0 0 0 4px color-mix(in srgb,var(--gold) 55%,transparent),inset 0 0 30px rgba(140,90,30,.18),0 10px 24px -16px rgba(40,25,10,.4)}
.ink,.fcard,.dcard,.mcard{background-image:linear-gradient(color-mix(in srgb,var(--page) 55%,transparent),color-mix(in srgb,var(--page) 55%,transparent)),var(--parch);background-size:auto,560px 560px}

/* splash: Canva Nordic gate, rune-carved, swings open.
   Smoothness rules: only opacity and transform animate; no animated filters; doors never pass 90deg; app animations pause underneath. */
.splash{position:fixed;inset:0;z-index:50;overflow:hidden;background:#07050a;cursor:pointer;transition:opacity .9s cubic-bezier(.37,0,.63,1)}
.splash.gone{opacity:0;pointer-events:none}
.gate{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh * 1080 / 1913));aspect-ratio:1080/1913;margin-top:calc(env(safe-area-inset-top,0px) * .8 + 1.5vh);
 transform:translate3d(-50%,-50%,0) scale(1.05);opacity:0;perspective:1800px;will-change:transform,opacity;
 transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1.4s cubic-bezier(.22,1,.36,1)}
.splash.ready .gate{opacity:1;transform:translate3d(-50%,-50%,0) scale(1)}
.splash.open .gate{transform:translate3d(-50%,-50%,0) scale(1.16);transition:transform 2.2s cubic-bezier(.65,0,.35,1)}
.gate>img,.gate .leaf,.gate svg.runes{position:absolute}
.gate>img{inset:0;width:100%;height:100%}
.gate .torch{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 2% 42%,rgba(255,150,40,.28),transparent 42%),radial-gradient(ellipse at 98% 42%,rgba(255,150,40,.24),transparent 42%);animation:torch 2.2s ease-in-out infinite alternate;will-change:opacity}
@keyframes torch{0%{opacity:.55}40%{opacity:1}60%{opacity:.75}100%{opacity:.9}}

.ring,.due .glyph,.moonbox,.seal,.night-top,.cad,.tale .tick,.step .nd,.inkb .orb{position:relative}
.ring::after,.due .glyph::after,.moonbox::after,.seal::after,.night-top::after,.cad::after,.tale .tick::after,.step .nd::after,.inkb .orb::before{
 content:"";position:absolute;pointer-events:none;background:var(--torc) center/contain no-repeat;filter:drop-shadow(0 1px 1.5px rgba(40,20,0,.45));z-index:2}
.ring::after{inset:-9px}
.inkb .orb::before{inset:-8px;border-radius:0}
.due .glyph::after{inset:-6px}
.tale .tick::after{inset:-6px}
.step .nd::after{inset:-6px}
.moonbox::after{left:50%;top:-6px;width:58px;height:58px;transform:translateX(-50%)}
.seal::after{left:50%;top:-6px;width:56px;height:56px;transform:translateX(-50%)}
.night-top::after{left:-9px;top:50%;width:114px;height:114px;transform:translateY(-50%)}
.cad::after{left:-9px;top:50%;width:114px;height:114px;transform:translateY(-50%)}
.seals{row-gap:14px}
/* falling feathers (Canva art, flutter physics in JS) */
.fslit{position:absolute;z-index:6;width:10px;height:2px;border-radius:2px;background:rgba(40,22,10,.75);box-shadow:0 1px 0 rgba(255,240,210,.5);pointer-events:none}
.fdust{position:absolute;z-index:8;width:3px;height:3px;border-radius:50%;background:rgba(120,90,50,.7);pointer-events:none;animation:fDust .6s ease-out forwards}
.fdust.fink{background:rgba(70,60,120,.75);width:2px;height:2px}
@keyframes fDust{to{transform:translate(var(--dx),var(--dy));opacity:0}}
/* Fenrir, the wolf pup who hops onto what's still undone */
#fenrir{position:absolute;left:0;top:0;z-index:6;width:58px;height:75px;pointer-events:none;opacity:0;transition:opacity .4s;will-change:transform}
#fenrir.on{opacity:1}
#fenrir .fw{position:absolute;inset:0;transform-origin:50% 100%}
#fenrir img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:none;filter:drop-shadow(0 3px 3px rgba(20,10,0,.35))}
#fenrir[data-f="0"] .f0,#fenrir[data-f="1"] .f1,#fenrir[data-f="2"] .f2{display:block}
#fenrir .f0{height:75px}#fenrir .f1{height:65px}#fenrir .f2{height:52px;bottom:10px}
#fenrir.left .fw{transform:scaleX(-1)}
#fenrir.idle .f0{animation:fenBreath 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes fenBreath{0%,100%{transform:translateX(-50%) scaleY(1)}50%{transform:translateX(-50%) scaleY(1.025)}}
#fenrir .fsh{position:absolute;left:50%;bottom:-3px;width:44px;height:8px;margin-left:-22px;border-radius:50%;background:radial-gradient(rgba(30,15,0,.3),rgba(30,15,0,0) 70%)}
#fenrir .fw{pointer-events:auto;cursor:pointer;left:8px;right:8px;top:10px}
#fenrir .fbub{position:absolute;bottom:80px;left:30px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;background:var(--page,#f6ecd6);color:var(--ink,#2a1d10);border:1.5px solid #2a1d10;border-radius:10px 10px 10px 2px;padding:4px 9px;font:700 12px/1.3 var(--f-body,system-ui);box-shadow:0 3px 8px rgba(40,20,0,.18);opacity:0;transform:translateY(6px) scale(.9);transform-origin:0 100%;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#fenrir .fbub.flip{left:auto;right:30px;border-radius:10px 10px 2px 10px;transform-origin:100% 100%}
#fenrir .fbub.on{opacity:1;transform:none}
.fring{position:absolute;z-index:6;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid rgba(150,210,255,.75);border-radius:50%;pointer-events:none;animation:fRing 1.1s ease-out forwards}
@keyframes fRing{to{transform:translateY(-26px) scale(3.4);opacity:0}}
#fenrir.a-howl .f0{animation:fHowl 1.6s ease-in-out}
@keyframes fHowl{0%,100%{transform:translateX(-50%)}20%,80%{transform:translateX(-50%) rotate(-16deg) scaleY(1.05)}}
#fenrir.a-sniff .f1{animation:fSniff .35s ease-in-out 4}
@keyframes fSniff{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 3px)) translateY(1px)}}
#fenrir.a-wag .f0{animation:fWag .15s linear 8}
@keyframes fWag{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}
#fenrir.a-growl .f1{animation:fGrowl .07s linear 20}
@keyframes fGrowl{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% - 1.5px))}}
#fenrir.a-shake .f0{animation:fShake .09s linear 10}
@keyframes fShake{0%,100%{transform:translateX(-50%) skewX(0)}25%{transform:translateX(calc(-50% - 2px)) skewX(-6deg)}75%{transform:translateX(calc(-50% + 2px)) skewX(6deg)}}
#fenrir.a-spin .fw{animation:fSpin 1.1s ease-in-out}
@keyframes fSpin{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
#fenrir.a-bow .f1{animation:fBow .45s ease-in-out 3}
@keyframes fBow{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-6px) rotate(4deg)}}
#fenrir.a-yawn .f0{animation:fYawn 1.6s ease-in-out}
@keyframes fYawn{0%,100%{transform:translateX(-50%)}35%,65%{transform:translateX(-50%) rotate(-10deg) scale(1.03,.97)}}
#fenrir.a-scratch .f0{animation:fScr .1s linear 12}
@keyframes fScr{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-4deg) translateY(1px)}}
#fenrir.a-tilt .f0{animation:fTilt 1.4s ease-in-out}
@keyframes fTilt{0%,100%{transform:translateX(-50%)}25%,55%{transform:translateX(-50%) rotate(9deg)}70%{transform:translateX(-50%) rotate(-6deg)}}
#fenrir.a-hop .f2{animation:fHop .45s ease-out 2}
@keyframes fHop{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-22px) rotate(-8deg)}}
.fthr{position:fixed;left:0;top:0;z-index:7;pointer-events:none;will-change:transform,opacity;opacity:0}
.fthr img{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
@media (prefers-reduced-motion:reduce){.fthr{display:none}}

/* micro-looped icon animations */
.gly *{transform-box:view-box}
.a-write{animation:aWrite 2s ease-in-out infinite}
@keyframes aWrite{0%,100%{transform:rotate(0) translate(0,0)}25%{transform:rotate(-7deg) translate(.6px,0)}50%{transform:rotate(3deg) translate(1.4px,-.4px)}75%{transform:rotate(-4deg) translate(.8px,0)}}
.a-draw{stroke-dasharray:16;animation:aDraw 2.4s ease-in-out infinite}
@keyframes aDraw{0%{stroke-dashoffset:16}55%,100%{stroke-dashoffset:0}}
.a-flip{animation:aFlip 3s ease-in-out infinite alternate}
@keyframes aFlip{0%,30%{transform:scaleX(1)}70%,100%{transform:scaleX(-1)}}
.a-swing{animation:aSwing 2.6s ease-in-out infinite}
@keyframes aSwing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.a-wave{animation:aWave 1.2s ease-in-out infinite}
@keyframes aWave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(12deg) scaleX(.85)}}
.a-needle{animation:aNeedle 3.4s ease-in-out infinite}
@keyframes aNeedle{0%,100%{transform:rotate(-25deg)}30%{transform:rotate(35deg)}55%{transform:rotate(-10deg)}75%{transform:rotate(15deg)}}
.a-twinkle{animation:aTw 1.8s ease-in-out infinite;transform-box:fill-box!important;transform-origin:center}
@keyframes aTw{0%,100%{transform:scale(.6);opacity:.45}50%{transform:scale(1.2);opacity:1}}
.a-bob{animation:aBob 2.2s ease-in-out infinite}
@keyframes aBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
.a-flick{animation:aFlick .45s ease-in-out infinite alternate}
@keyframes aFlick{from{transform:scale(.88,.85) skewX(-4deg)}to{transform:scale(1.06,1.12) skewX(4deg)}}
.a-rock{animation:aRock 2.8s ease-in-out infinite}
@keyframes aRock{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-25deg)}90%{transform:rotate(8deg)}}
.a-spin{animation:aSpin 7s linear infinite}
@keyframes aSpin{to{transform:rotate(360deg)}}
.a-sand{stroke-dasharray:1.5 2.5;animation:aSand .6s linear infinite}
@keyframes aSand{to{stroke-dashoffset:-4}}
.ribbons button:not([aria-selected="true"]) .gly *{animation-play-state:paused}
.ribbons .gly{width:19px;height:19px}

/* desk */
.d-hero{padding:14px 14px 16px;overflow:hidden}
.d-hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.eyebrow{font:800 10.5px var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.d-hello h2{font:800 23px/1.15 var(--f-head);letter-spacing:-.02em;margin-top:2px}
.d-hello h2 em{font-style:normal;color:var(--verm)}
.d-stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font:800 11.5px var(--f-head);padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--gold)) 14%,transparent);color:var(--c,var(--gold));white-space:nowrap}
.pill .gly{width:14px;height:14px}
.d-hero .perch{margin:2px auto -4px;max-width:520px}
.d-msg{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;background:color-mix(in srgb,var(--gold) 13%,var(--page));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:14px;padding:10px 12px;position:relative}
.d-msg .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:#fff}
.d-msg .ic .gly{width:22px;height:22px}
.d-msg b{display:block;font-weight:800;font-size:14.5px;line-height:1.25}
.d-msg span{font-size:12.5px;color:var(--ink-2);line-height:1.35;display:block;margin-top:2px}
.d-send{display:flex;justify-content:flex-end;margin-top:10px}
.btn.pillbtn{border-radius:99px;padding:8px 14px;font-weight:800;text-decoration:none}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px -4px}
.sec-h h3{font:800 17px var(--f-head);letter-spacing:-.01em}
.sec-h span{font-size:12px;color:var(--ink-2)}

.spot{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:18px;cursor:pointer;color:var(--ink);
 background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--page)),color-mix(in srgb,var(--c) 6%,var(--page)));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);box-shadow:0 14px 30px -20px var(--c)}
.spot-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.spot-ic .gly{width:34px;height:34px;color:#fff!important}
.spot .eyebrow{color:var(--c)}
.spot b{display:block;font:800 18px/1.2 var(--f-head);letter-spacing:-.01em;margin-top:2px}
.spot .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.35}
.spot-due{text-align:center;min-width:58px}
.spot-due b{font:900 30px/1 var(--f-head);color:var(--c)}
.spot-due span{font:800 10px var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.spot-go{position:absolute;right:14px;bottom:10px;font:800 11px var(--f-head);color:var(--c);letter-spacing:.06em}

.deck{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.dcard{flex:0 0 156px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--page);border:1px solid var(--edge);position:relative;overflow:hidden;cursor:pointer;min-height:168px;
 background-image:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 55%)}
.dcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.dcard .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--page))}
.dcard .ic .gly{width:24px;height:24px}
.dcard b{font:800 14px/1.25 var(--f-head);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dcard .chip{margin-top:auto;align-self:flex-start}

.night{position:relative;overflow:hidden;border-radius:18px;padding:16px;color:#efe6d2;background:#0a0816;
 --page-2:#2a2541;--edge:#3d3658;--ink-2:#c3b9de;--ink:#efe6d2;box-shadow:0 18px 34px -22px #1d1934}
.night .sky{position:absolute;inset:-8% -6%;background:url("art/sky.webp") center/cover no-repeat;pointer-events:none;
 animation:skyDrift 120s ease-in-out infinite alternate;will-change:transform}
.night .veil{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse 95% 80% at 20% 34%,rgba(7,5,16,.82),rgba(7,5,16,.28) 72%),linear-gradient(170deg,rgba(9,7,22,.42),rgba(6,4,14,.66))}
@keyframes skyDrift{from{transform:scale(1.04) translate3d(-1.2%,.6%,0)}to{transform:scale(1.09) translate3d(1.2%,-.8%,0)}}
.night .stars{position:absolute;inset:0;pointer-events:none}

(function(){

const FORMS = {
 shakes:{n:"Shakespearean Sonnet", s:"14 lines · 3 quatrains + a couplet", lines:14, syl:10, scheme:"ABAB CDCD EFEF GG",
  rules:["14 lines in iambic pentameter: ten syllables, five feet of ˘ ´ (da-DUM): \"the TIDE | is HIGH | and I | am ON | my WAY\".","Rhyme ABAB CDCD EFEF GG: three four-line quatrains, then a rhyming couplet.","Each quatrain ⁂ pushes the idea one step further. Quatrain 3 or the couplet twists it: the volta ↻.","The final couplet lands the punch: a verdict, reversal or sting."],

 vill:{n:"Villanelle", s:"19 lines · 2 refrains, 2 rhymes", lines:19, syl:10, scheme:"A1bA2 abA1 abA2 abA1 abA2 abA1A2",

  dare:"Refrain idea: \"Let's get busy, Sockethole\" vs. a line about rest. Let them argue."},
 pant:{n:"Pantoum", s:"Quatrains that braid lines", lines:16, syl:0, scheme:"ABAB BCBC CDCD DADA",
  rules:["Any number of four-line stanzas (4 is a good start).","⇄ Lines 2 and 4 of each stanza become lines 1 and 3 of the next.","Rhyme ABAB is traditional but optional.","In the final stanza, lines 2 and 4 are the first stanza's lines 3 and 1, so the poem closes on its first line."],

 ghazal:{n:"Ghazal", s:"5+ couplets · radif + signature", lines:10, syl:0, scheme:"AA bA cA dA eA",

function lineMarks(k, i){ // 0-based line index -> {mk, brk}
 const n = i+1; let mk = "", brk = false;

 return {mk, brk};
}

// ================= helpers =================
const pad = n => String(n).padStart(2,"0");
const ds = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const add = (s,n) => { const d=pd(s); d.setDate(d.getDate()+n); return ds(d); };
const today = () => ds(new Date());
const diff = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const dow = s => pd(s).getDay();
const weekStart = s => add(s,-dow(s));
const fmt = s => pd(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtW = s => pd(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// poems
function lastPoem(){ const p = logsOf("poem").map(l=>l.d).sort(); return p.length ? p[p.length-1] : null; }

function formsTried(){ const o={}; logsOf("poem").forEach(l=>{ if(l.f) o[l.f]=(o[l.f]||0)+1; }); return o; }
function nextForm(){ const tried = formsTried(); const un = FORM_ORDER.find(f=>!tried[f]); if(un) return un;
 const last = {}; logsOf("poem").forEach(l=>{ if(l.f) last[l.f]=l.d; }); return FORM_ORDER.slice().sort((a,b)=>(last[a]||"")<(last[b]||"")?-1:1)[0]; }

function weeksFor(w){ return w > 8000 ? 2 : 1; }
function taleDues(){ let d = "2026-11-22"; return S.tales.map(t => { const due = add(d, (weeksFor(t.w)-1)*7); d = add(due,7); return due; }); }

function nextTale(){ const dues = taleDues(); for(let i=0;i<S.tales.length;i++) if(!taleRead(S.tales[i].id)) return {t:S.tales[i], due:dues[i], i}; return null; }

function stageOfStory(s){ return Math.min(4, (s.base||0) + logsOf("stage",s.id).length); }

// drawing path
function drawState(){
 let s = (S.drawBase.s||0) + logsOf("draw").length + logsOf("drawDone").length, f = (S.drawBase.f||0) + logsOf("drawDone").length;
 const out = []; let cur = -1;
 DRAW.forEach((m,i) => { const okS = Math.min(s,m.s), okF = Math.min(f,m.f); const done = okS>=m.s && okF>=m.f && cur===-1;
  if(cur===-1 && !done){ cur=i; out.push({m,i,s:okS,f:okF,state:"cur"}); }
  else if(done){ s-=m.s; f-=m.f; out.push({m,i,s:m.s,f:m.f,state:"done"}); }
  else out.push({m,i,s:0,f:0,state:"lock"}); });
 return {mods:out, cur};
}

// hubspot
function hubDone(){ return (S.hub.base||0) + logsOf("hub").length; }

// week cadences (6 seals)
function weekCounts(ws){ const we = add(ws,6), c = {}; S.logs.forEach(l => { if(l.d>=ws && l.d<=we) c[l.k]=(c[l.k]||0)+1; }); return c; }
function seals(ws){
 const c = weekCounts(ws), g = k => c[k]||0;
 const hubFinished = S.hub.total>0 && hubDone()>=S.hub.total || g("cert")>0;
 return [
  {k:"verse", n:"Verse", c:"var(--verm)", have:g("poem"), need:Math.max(1,Math.round(7/S.poemEvery))},
  {k:"tale", n:"Tale", c:"var(--plum)", have:g("tale"), need:1},
  {k:"quill", n:"Quill", c:"var(--gold)", have:g("sec")+g("stage"), need:2},
  {k:"saga", n:"Saga", c:"var(--lapis)", have:g("novel")+g("lore")+g("rp")+g("ms"), need:2},
  {k:"brush", n:"Brush", c:"var(--verd)", have:g("draw")+g("drawDone"), need:2},
  {k:"guild", n:"Guild", c:"var(--umber)", have:hubFinished?2:g("hub"), need:2}
 ].map(x => Object.assign(x,{met:x.have>=x.need}));
}
function moonstones(){ let n=0; for(let ws=START; ws<weekStart(today()); ws=add(ws,7)){ if(S.eclipse[ws]) continue; if(seals(ws).every(x=>x.met)) n++; } if(!S.eclipse[weekStart(today())] && seals(weekStart(today())).every(x=>x.met)) n++; return n; }

function parseHash(){
 const h = decodeURIComponent((location.hash||"").slice(1));
 if(!/^raven-asc-/.test(h)) return;
 const p = h.split("-"); // raven asc ts left total streak buffer gear
 const n = v => v && v[0]==="n" ? -parseInt(v.slice(1),10) : parseInt(v,10);
 const ts = p[2]||"";
 inbox = {ts, at: ts.length===12 ? ts.slice(0,4)+"-"+ts.slice(4,6)+"-"+ts.slice(6,8)+" "+ts.slice(8,10)+":"+ts.slice(10,12) : "", left:n(p[3]), total:n(p[4]), streak:n(p[5]), buffer:n((p[6]||"").replace(/^b/,"")), gear:p[7]||"y", fresh:true};
 saveInbox();
 try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
 setTimeout(()=>{ toast("A raven arrived from the Ascension Log","big"); caw(); },1400);
}
function stamp(){ const d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes()); }
function ravenOut(){
 const pdays = diff(today(), poemDue());

 const met = seals(weekStart(today())).filter(x=>x.met).length;
 const intern = S.stories.find(s=>s.id==="intern");
 const enc = v => v<0 ? "n"+(-v) : String(v);
 return ASC_URL+"#raven-cdx-"+stamp()+"-"+enc(pdays)+"-"+dueSoon+"-"+met+"-"+(intern?secDone(intern):0);
}

function dueItems(){

 const pd_ = poemDue(); out.push({k:"poem", c:"var(--verm)", t:"Poem due "+fmtW(pd_), s:"Suggested form: "+FORMS[nextForm()].n+". One poem every "+S.poemEvery+" days.", days:diff(t,pd_), tab:"verse"});
 const nt = nextTale(); if(nt) out.push({k:"tale", c:"var(--plum)", t:"Read: "+nt.t.t, s:nt.t.a+" · ≈"+Math.round(nt.t.w/WPM)+" min · finish by "+fmtW(nt.due), days:diff(t,nt.due), tab:"tales"});
 const st = activeStory(); if(st){ const i=S.stories.indexOf(st), sg=stageOfStory(st), due=st.due[sg];
  if(st.sections && sg===2){ const left=st.sections-secDone(st); out.push({k:"quill", c:"var(--gold)", t:storyName(st,i)+": "+left+" section"+(left===1?"":"s")+" to go", s:"Bare draft due "+fmtW(due)+(left>0&&diff(t,due)>0?" · about "+Math.ceil(left/Math.max(1,Math.ceil(diff(t,due)/3.5)))+" per sitting (Thu + Sat)":""), days:diff(t,due), tab:"tales"}); }
  else out.push({k:"quill", c:"var(--gold)", t:storyName(st,i)+": "+STAGES[sg], s:STAGE_HOW[sg]+" Due "+fmtW(due)+".", days:diff(t,due), tab:"tales"}); }
 for(const key in NOVELS){ const N=NOVELS[key], m=N.ms.find(x=>!has("ms",x.id)); if(m) out.push({k:"saga", c:N.c, t:N.n+": "+m.t, s:"Milestone due "+fmtW(m.due), days:diff(t,m.due), tab:"novels"}); }
 const dsx = drawState(); if(dsx.cur>=0){ const m=dsx.mods[dsx.cur]; out.push({k:"brush", c:"var(--verd)", t:"Portrait Path "+(dsx.cur+1)+": "+m.m.t, s:m.s+"/"+m.m.s+" sessions · "+m.f+"/"+m.m.f+" finished · "+m.m.ex, days:99, tab:"studio"}); }
 if(S.hub.total>0 && hubDone()<S.hub.total){ const left=S.hub.total-hubDone(), dl=diff(t,S.hub.due); out.push({k:"guild", c:"var(--umber)", t:"HubSpot: "+left+" module"+(left===1?"":"s")+" left", s:"Finish by "+fmtW(S.hub.due)+(dl>0?" · "+Math.ceil(left/Math.max(1,dl/7))+" a week":""), days:dl, tab:"studio"}); }
 else if(!S.hub.total) out.push({k:"guild", c:"var(--umber)", t:"HubSpot: set your course", s:"Name the course and its module count in Studio so the pace can be tracked.", days:5, tab:"studio"});
 return out.sort((a,b)=>a.days-b.days);
}

 const a = FEN_ACTS[name], el = FEN.el; FEN.busy = true; el.classList.remove("idle"); el.dataset.f = a.f; el.classList.add(a.cls);
 fenSay(a.say(), Math.max(1500, a.ms+300));
 if(a.ring){ for(let i=0;i<3;i++) setTimeout(()=>{ const r = document.createElement("i"); r.className = "fring"; r.style.left = (FEN.x + 14*FEN.facing)+"px"; r.style.top = (FEN.y - 66)+"px"; document.body.appendChild(r); setTimeout(()=>r.remove(), 1100); }, 200 + i*320); }

function fenPut(x,y){ FEN.x = x; FEN.y = y; FEN.el.style.transform = "translate3d("+(x-29).toFixed(1)+"px,"+(y-75).toFixed(1)+"px,0)"; }

 if(!FEN.el) return; clearTimeout(FEN.timer);
 if(!FEN_SEL[tab] || document.hidden){ FEN.el.classList.remove("on"); FEN.cur = null; return; }
 if(FEN.busy) return fenSoon(600);
 const all = fenTargets();
 if(!all.length){ FEN.el.classList.remove("on"); FEN.cur = null; return fenSoon(2500); }
 const pool = all.filter(e => e!==FEN.cur), next = (pool.length ? pool : all)[Math.floor(Math.random()*(pool.length||all.length))];
 const b = next.getBoundingClientRect(), tx = b.left + 34 + Math.random()*Math.max(10, b.width-68) + scrollX, ty = b.top + 6 + scrollY;
 if(!FEN.el.classList.contains("on")){ // bound in from the nearest side
  const fromL = tx - scrollX < innerWidth/2; fenPut(fromL ? scrollX-40 : scrollX+innerWidth+40, ty - 120); FEN.el.classList.add("on"); }

function fenHop(tx, ty){
 const el = FEN.el, x0 = FEN.x, y0 = FEN.y, dx = tx-x0, dist = Math.hypot(dx, ty-y0);
 FEN.busy = true; el.classList.remove("idle");
 FEN.facing = dx >= 0 ? 1 : -1; el.classList.toggle("left", FEN.facing<0);
 const fw = el.querySelector(".fw"); el.dataset.f = "1"; fw.style.transform = (FEN.facing<0?"scaleX(-1) ":"")+"scale(1.04,.9)";
 setTimeout(()=>{
  el.dataset.f = "2"; fw.style.transform = FEN.facing<0 ? "scaleX(-1)" : "";
  const dur = Math.min(950, 420 + dist*.9), arc = Math.min(150, 40 + dist*.32), t0 = performance.now();
  const step = now => { const k = Math.min(1, (now-t0)/dur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
   const x = x0 + dx*e, y = y0 + (ty-y0)*e - arc*4*k*(1-k);
   const tilt = (k<.5 ? -14 : 18*(k-.5)*2) * FEN.facing;
   fenPut(x, y); fw.style.transform = (FEN.facing<0?"scaleX(-1) ":"")+"rotate("+tilt*FEN.facing+"deg)";
   if(k<1) return requestAnimationFrame(step);
   // land: squash, dust, then sit and keep watch
   el.dataset.f = "1"; fw.style.transform = (FEN.facing<0?"scaleX(-1) ":"")+"scale(1.08,.86)";
   for(let i=0;i<6;i++){ const d = document.createElement("i"); d.className = "fdust"; const a = Math.PI + Math.random()*Math.PI, v = 8+Math.random()*14;
    d.style.left = (tx + (Math.random()-.5)*30)+"px"; d.style.top = ty+"px"; d.style.setProperty("--dx",(Math.cos(a)*v).toFixed(1)+"px"); d.style.setProperty("--dy",(Math.sin(a)*v*.5).toFixed(1)+"px"); document.body.appendChild(d); setTimeout(()=>d.remove(),600); }
   setTimeout(()=>{ fw.style.transform = FEN.facing<0 ? "scaleX(-1)" : ""; el.dataset.f = "0"; el.classList.add("idle"); FEN.busy = false;
    if(Math.random()<.75) setTimeout(()=>fenAct(), 700 + Math.random()*1200); fenSoon(5200 + Math.random()*4800); }, 200);
  };
  requestAnimationFrame(step);
 }, 260);
}

function loomHTML(k){
 const SEP = ["⁂","↻","✂","⤵"];
 const toks = LOOM[k].split(" ");
 const cls = t => { const c=t.replace(/[^A-Za-z0-9]/g,"")[0]||"x"; if(/[0-9]/.test(c)) return "lm-"+("ABCDEFG"[(+c-1)%7]||"x"); if(c==="x") return "lm-x"; return "lm-"+c.toUpperCase(); };
 let h = '<div class="loom" aria-label="Pattern '+esc(LOOM[k])+'">'+toks.map(t=> SEP.includes(t) ? '<i class="sym" title="'+esc((SYMKEY.find(s=>s[0]===t)||["",""])[1])+'">'+t+'</i>' : '<i class="'+cls(t)+(/\d/.test(t)&&k==="vill"?" ref":"")+'" style="'+(t.length>2?"width:auto;padding:0 4px":"")+'">'+(t==="x"?"·":esc(t))+'</i>').join("")+'</div>';
 if(METER[k]) h += '<div class="muted small" style="margin-top:6px">Meter, one line: five feet of da-DUM</div><div class="meter" aria-label="Iambic pentameter">'+Array.from({length:METER[k]},(_,i)=>(i?'<i class="ft"></i>':'')+'<i></i><i class="st"></i>').join("")+'</div><div class="meter-l"><span>◡ unstressed (da)</span><span style="color:var(--verm)">▍ stressed (DUM)</span><span>| foot</span></div>';
 return h;
}

// ---------- the pad's analysis ----------
function syl(w){
 w = w.toLowerCase().replace(/[^a-z]/g,""); if(!w) return 0; if(w.length<=3) return 1;
 w = w.replace(/(?:[^laeiouy]es|[^laeiouy]ed|[^laeiouy]e)$/,"").replace(/^y/,"");
 const m = w.match(/[aeiouy]{1,2}/g); return Math.max(1, m ? m.length : 1);
}
const lineSyl = l => l.split(/\s+/).reduce((a,w)=>a+syl(w),0);
function rhymeKey(l){ const w = (l.trim().toLowerCase().match(/[a-z']+(?=[^a-z']*$)/)||[""])[0].replace(/'/g,""); if(!w) return "";
 const m = w.match(/[aeiouy]+[^aeiouy]*e?$/); let k = m ? m[0] : w.slice(-2); if(k.length<2) k = w.slice(-3); return k.replace(/e$/,"").replace(/y$/,"ee") || w; }
const lastWord = l => (l.trim().toLowerCase().match(/[a-z']+(?=[^a-z']*$)/)||[""])[0];
function analyse(){
 const pad = document.getElementById("pad"), out = document.getElementById("padOut"); if(!pad||!out) return;
 const F = FORMS[ui.form], all = pad.value.split("\n"), lines = all.filter(l=>l.trim());
 const keys = {}, letters = []; let nextL = 0;
 lines.forEach(l=>{ const k = rhymeKey(l); let L = null; for(const kk in keys) if(kk===k || (k.length>=3 && kk.length>=3 && kk.slice(-3)===k.slice(-3))) L = keys[kk]; if(!L){ L = "ABCDEFGHIJKLMNOP"[nextL++]||"?"; keys[k]=L; } letters.push(L); });
 const target = i => F.sylList ? F.sylList[i] : F.syl || null;
 let rows = lines.map((l,i)=>{ const s = lineSyl(l), tg = target(i), ok = tg==null ? null : Math.abs(s-tg) <= (F.sylList?0:1);
  const M = lineMarks(ui.form,i);
  return '<div><span class="mk">'+M.mk+'</span><em class="num">'+(i+1)+'</em><span>'+esc(l.length>46?l.slice(0,44)+"…":l)+'</span><span class="num '+(ok===null?"":ok?"good":"bad")+'">'+s+(tg?"/"+tg:"")+'</span><i class="lm-'+(letters[i]&&letters[i]<="G"?letters[i]:"x")+'" style="width:22px;height:22px;border-radius:3px;display:grid;place-items:center;color:#fff;font:700 11px var(--f-body);font-style:normal">'+letters[i]+'</i></div>'+(M.brk && i<lines.length-1?'<div class="brk">⁂</div>':''); }).join("");
 const chips = [];
 const lc = lines.length, needL = ui.form==="pant" ? null : F.lines;
 if(needL) chips.push(chip(lc===needL, lc+"/"+needL+" lines"));
 else chips.push(chip(lc>=8 && lc%4===0, lc+" lines (quatrains)"));
 if(ui.form==="shakes"||ui.form==="petr"){ const want = (ui.form==="shakes"?"ABABCDCDEFEFGG":"ABBAABBACDECDE"); const got = normScheme(letters.slice(0,14)); if(lc>=4) chips.push(chip(got===normScheme(want.slice(0,lc).split("")), "scheme "+got.slice(0,14))); }
 if(ui.form==="vill" && lc>=6){ const n = i => norm(lines[i]||""); const r1 = [5,11,17].filter(i=>i<lc).every(i=>n(i)===n(0)), r2 = [8,14,18].filter(i=>i<lc).every(i=>n(i)===n(2)); chips.push(chip(r1,"refrain A1 returns")); if(lc>=9) chips.push(chip(r2,"refrain A2 returns")); }
 if(ui.form==="pant" && lc>=8){ let ok=true; for(let s=1; s*4+3<lc+1 && s*4<lc; s++){ if(norm(lines[s*4])!==norm(lines[s*4-3]) || (lines[s*4+2]!=null && norm(lines[s*4+2])!==norm(lines[s*4-1]))) ok=false; } chips.push(chip(ok,"lines 2 & 4 carry forward")); }
 if(ui.form==="ghazal" && lc>=2){ const end = l => l.trim().toLowerCase().split(/\s+/).slice(-1)[0].replace(/[^a-z']/g,""); const rad = end(lines[0]); const ok = rad && end(lines[1])===rad && lines.filter((l,i)=>i%2===1).every(l=>end(l)===rad); chips.push(chip(ok,"radif \""+rad+"\" holds")); chips.push(chip(/arjuun|shade/i.test(lines.slice(-2).join(" ")),"signed in the last couplet")); }
 if(ui.form==="sest" && lc>=12){ const ew = lines.slice(0,6).map(lastWord), ord=[[6,1,5,2,4,3],[3,6,4,1,2,5],[5,3,2,6,1,4],[4,5,1,3,6,2],[2,4,6,5,3,1]]; let ok=true; ord.forEach((o,si)=>o.forEach((w,j)=>{ const L = lines[6*(si+1)+j]; if(L!=null && lastWord(L)!==ew[w-1]) ok=false; })); chips.push(chip(ok,"end-words spiral")); }
 if(F.sylList && lc) chips.push(chip(lines.every((l,i)=>lineSyl(l)===F.sylList[i]), F.sylList.join("-")+" syllables"));
 out.innerHTML = (lines.length? '<div class="lines">'+rows+'</div>' : '') + '<div class="checks">'+chips.join("")+'</div>';
}
const chip = (ok,t) => '<span class="chip '+(ok?"ok":"dim")+'">'+(ok?"✓ ":"")+esc(t)+'</span>';
const norm = s => String(s).toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
function normScheme(arr){ const m={}; let n=0; return arr.map(c=>{ if(!m[c]) m[c]="ABCDEFGHIJKLMNOP"[n++]; return m[c]; }).join(""); }

// ================= splash: the rune gate =================
// Lintel: CODEX spelled in Elder Futhark (ᚲᛟᛞᛖᚲᛊ, k-o-d-e-k-s). Door band: "bók rúna", Old Norse for "book of runes", in Younger Futhark (ᛒᚢᚴ ᚱᚢᚾᛅ).
const RUNE = {
 kE:"M7 4L2.5 8L7 12", oE:"M5 1L9 6L1.5 15M5 1L1 6L8.5 15", dE:"M1 1L1 15L9 1L9 15L1 1", eE:"M1 15L1 1L5 6L9 1L9 15", sE:"M7 1L2.5 6.5L7.5 9.5L3 15",
 bY:"M2 1L2 15M2 1L8 4.5L2 8L8 11.5L2 15", uY:"M2 15L2 1L8 6L8 15", kY:"M3 1L3 15M3 1.5L8 6.5", rY:"M2 15L2 1L8 4.5L2 8L8 15", nY:"M5 1L5 15M1.5 6L8.5 10", aY:"M5 1L5 15M1.5 10L8.5 6"
};
function runeRow(id, keys, x0, y0, sc, gap, delay0){
 const span = gap*(keys.length-1) + 10*sc, rnd = (a,b) => a + Math.random()*(b-a);
 let defs = '<defs><linearGradient id="mg-'+id+'" gradientUnits="userSpaceOnUse" x1="'+x0+'" y1="0" x2="'+(x0+span*.5)+'" y2="'+(y0+16*sc)+'" spreadMethod="reflect">'+
  '<stop offset="0" stop-color="#b5520e"/><stop offset=".22" stop-color="#f29a30"/><stop offset=".42" stop-color="#ffd468"/><stop offset=".5" stop-color="#fff7da"/><stop offset=".58" stop-color="#ffd468"/><stop offset=".8" stop-color="#ef8a26"/><stop offset="1" stop-color="#b5520e"/>'+
  '<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="'+(span*.5).toFixed(0)+' '+(16*sc)+'" dur="3.4s" repeatCount="indefinite"/></linearGradient>'+
  '<filter id="bl-'+id+'" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="'+(sc*1.3).toFixed(1)+'"/></filter></defs>';
 const G = [], E = [], B = [], M = [], C = [], FX = [];
 keys.forEach((k,i)=>{
  const tx = x0 + i*gap, d = (delay0 + i*0.14).toFixed(2), tr = 'translate('+tx.toFixed(1)+' '+y0+') scale('+sc+')', p = RUNE[k];
  G.push('<path class="groove" transform="'+tr+'" d="'+p+'" stroke-width="2"/>');
  E.push('<path class="ember" transform="'+tr+'" pathLength="60" d="'+p+'" stroke-width="1.55" style="transition-delay:'+d+'s"/>');
  B.push('<path transform="'+tr+'" pathLength="60" d="'+p+'" stroke-width="2.4" style="transition-delay:'+d+'s"/>');
  M.push('<path class="molten" transform="'+tr+'" pathLength="60" d="'+p+'" stroke="url(#mg-'+id+')" stroke-width=".95" style="transition-delay:'+d+'s"/>');
  C.push('<path class="crackle" transform="'+tr+'" d="'+p+'" stroke-width=".19" stroke-dasharray="1.1 1.6 .4 2.4 2.2 1.3 .5 2" style="animation-delay:-'+rnd(0,3.6).toFixed(2)+'s"/>');
  for(let n=0;n<4;n++){ const sx = tx + rnd(1,9)*sc, sy = y0 + rnd(2,15)*sc;
   FX.push('<circle class="spk" cx="'+sx.toFixed(1)+'" cy="'+sy.toFixed(1)+'" r="'+rnd(1.2,2.6).toFixed(1)+'" style="--d:'+rnd(1.8,3.4).toFixed(2)+'s;--dl:'+rnd(0,3).toFixed(2)+'s;--sx:'+rnd(-14,14).toFixed(0)+'px;--sy:'+rnd(-70,-30).toFixed(0)+'px"/>'); }
  for(let n=0;n<3;n++){ const cx = tx + rnd(1,9)*sc, cy = y0 + rnd(1,15)*sc, r = rnd(5,9);
   FX.push('<path class="tw" d="M'+cx.toFixed(1)+' '+(cy-r).toFixed(1)+'L'+(cx+r*.22).toFixed(1)+' '+(cy-r*.22).toFixed(1)+'L'+(cx+r).toFixed(1)+' '+cy.toFixed(1)+'L'+(cx+r*.22).toFixed(1)+' '+(cy+r*.22).toFixed(1)+'L'+cx.toFixed(1)+' '+(cy+r).toFixed(1)+'L'+(cx-r*.22).toFixed(1)+' '+(cy+r*.22).toFixed(1)+'L'+(cx-r).toFixed(1)+' '+cy.toFixed(1)+'L'+(cx-r*.22).toFixed(1)+' '+(cy-r*.22).toFixed(1)+'Z" style="--d:'+rnd(2.4,4.2).toFixed(2)+'s;--dl:'+rnd(0,4).toFixed(2)+'s"/>'); }
 });
 return defs + G.join("") + E.join("") + '<g class="bloom" filter="url(#bl-'+id+')">'+B.join("")+'</g>' + M.join("") + C.join("") + FX.join("");
}

// ---- rune fire: each rune burns in like a brand, leaving charred wood with living embers ----
const RF = {layers:[], on:false, t0:0, flare:0};
function rfSprite(stops, S){ const c=document.createElement("canvas"); c.width=c.height=S; const g=c.getContext("2d"); const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2); stops.forEach(s=>gr.addColorStop(s[0],s[1])); g.fillStyle=gr; g.fillRect(0,0,S,S); return c; }
const RFS = {
 flame: rfSprite([[0,"rgba(255,236,170,.95)"],[.2,"rgba(255,176,60,.85)"],[.45,"rgba(240,96,18,.5)"],[.72,"rgba(170,36,6,.18)"],[1,"rgba(110,16,0,0)"]],64),
 glow:  rfSprite([[0,"rgba(255,170,60,.55)"],[.45,"rgba(255,110,20,.18)"],[1,"rgba(255,80,0,0)"]],64),
 smoke: rfSprite([[0,"rgba(40,34,30,.5)"],[.5,"rgba(40,34,30,.22)"],[1,"rgba(40,34,30,0)"]],64)
};
function rfParse(d){ const out=[]; let cur=null; d.replace(/([ML])\s*([\d.\-]+)[ ,]([\d.\-]+)/g,(m,c,x,y)=>{ if(c==="M"){ cur=[]; out.push(cur); } cur.push([+x,+y]); return m; }); return out; }
function rfLayer(host, vbW, vbH, rows){
 const cv = document.createElement("canvas"); cv.className="rf"; host.appendChild(cv);
 const runes = [];
 rows.forEach(r => r.keys.forEach((k,i) => {
  const tx = r.x0 + i*r.gap, polys = rfParse(RUNE[k]).map(pl => pl.map(p => [tx + p[0]*r.sc, r.y0 + p[1]*r.sc]));
  const segs = []; let L = 0; polys.forEach(pl => { for(let j=1;j<pl.length;j++){ const a=pl[j-1], b=pl[j], l=Math.hypot(b[0]-a[0],b[1]-a[1]); segs.push({a,b,l,s0:L}); L+=l; } });
  runes.push({segs, L, sc:r.sc, start:r.delay0 + i*0.14, dur:.85});
 }));
 const L = {host, cv, x:cv.getContext("2d"), vbW, vbH, runes, parts:[], k:1};
 RF.layers.push(L); return L;
}
function rfAt(r, s){ for(const g of r.segs){ if(s <= g.s0+g.l){ const t=(s-g.s0)/g.l; return [g.a[0]+(g.b[0]-g.a[0])*t, g.a[1]+(g.b[1]-g.a[1])*t]; } } const g=r.segs[r.segs.length-1]; return g.b; }
function rfSize(L){ const r = L.host.getBoundingClientRect(), dpr = Math.min(1.75, devicePixelRatio||1);
 if(!r.width) return false; const w = Math.round(r.width*dpr), h = Math.round(r.height*dpr);
 if(L.cv.width!==w || L.cv.height!==h){ L.cv.width=w; L.cv.height=h; } L.k = w/L.vbW; return true; }
function rfStart(){ if(RF.on || RM_()) return; RF.on = true; RF.t0 = performance.now(); requestAnimationFrame(rfTick); }
function rfFlare(){ RF.flare = performance.now(); RF.layers.forEach(L => L.runes.forEach(r => { for(let n=0;n<10;n++){ const p = rfAt(r, Math.random()*r.L); rfSpark(L, p, 1.6); } })); }
function rfSpark(L, p, power){ const a = -Math.PI/2 + (Math.random()-.5)*1.9, v = (2.2+Math.random()*4.2)*(power||1);
 L.parts.push({t:"s", x:p[0], y:p[1], px:p[0], py:p[1], vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:0, max:.5+Math.random()*.9, w:.6+Math.random()*.8}); }
function rfTick(now){
 const sp = document.getElementById("splash");
 if(!sp || sp.hidden){ RF.on = false; return; }
 const t = (now - RF.t0)/1000, flare = Math.max(0, 1 - (now - RF.flare)/900);
 RF.layers.forEach(L => {
  if(!rfSize(L)) return;
  const X = L.x, k = L.k; X.setTransform(k,0,0,k,0,0); X.clearRect(0,0,L.vbW,L.vbH);
  L.runes.forEach(r => {
   const p = Math.max(0, Math.min(1, (t - r.start)/r.dur)); if(p<=0) return;
   const burned = r.L*p, step = 1.1*r.sc;
   // scorch halo + charred groove, drawn only as far as the fire has reached
   X.globalCompositeOperation = "source-over"; X.lineCap = X.lineJoin = "round";
   const path = () => { X.beginPath(); let left = burned; for(const g of r.segs){ if(left<=0) break; const f = Math.min(1,left/g.l); X.moveTo(g.a[0],g.a[1]); X.lineTo(g.a[0]+(g.b[0]-g.a[0])*f, g.a[1]+(g.b[1]-g.a[1])*f); left -= g.l; } };
   path(); X.strokeStyle = "rgba(25,12,4,.28)"; X.lineWidth = 6.2*r.sc; X.stroke();
   path(); X.strokeStyle = "rgba(8,4,2,.92)"; X.lineWidth = 2.5*r.sc; X.stroke();
   X.save(); X.translate(.35*r.sc,-.25*r.sc); path(); X.strokeStyle = "rgba(30,14,5,.5)"; X.lineWidth = 2.9*r.sc; X.stroke(); X.restore();   // ragged, uneven char edge
   X.globalCompositeOperation = "lighter"; path(); X.strokeStyle = "rgba(150,30,4,"+(.55+.3*flare)+")"; X.lineWidth = 1.15*r.sc; X.stroke();          // deep smouldering bed under the embers
   // the living ember core: hot where the brand just passed, cooling to a slow, breathing red
   X.globalCompositeOperation = "lighter";
   let prev = null;
   for(let s=0; s<=burned; s+=step){
    const q = rfAt(r, s), tb = t - (r.start + (s/r.L)*r.dur);
    const n = .5+.5*Math.sin(t*5.3 + s*.21)*Math.sin(t*2.1 + s*.07);
    const heat = Math.min(1, .28 + .72*Math.exp(-tb/.7) + .22*n + .8*flare);
    if(prev){ X.strokeStyle = "hsla("+(8+heat*36)+",100%,"+(24+heat*50)+"%,"+(.25+.6*heat)+")"; X.lineWidth = (.45+.6*heat)*r.sc; X.beginPath(); X.moveTo(prev[0],prev[1]); X.lineTo(q[0],q[1]); X.stroke(); }
    if(Math.random() < .05*heat){ const g = 7*r.sc*(.6+heat); X.globalAlpha = .35*heat; X.drawImage(RFS.glow, q[0]-g, q[1]-g, 2*g, 2*g); X.globalAlpha = 1; }
    prev = q;
   }
   // the brand's head: a bright knot of fire running along the stroke
   if(p < 1){ const h = rfAt(r, burned); const g = 4.2*r.sc; X.drawImage(RFS.flame, h[0]-g, h[1]-g, 2*g, 2*g);
    for(let n=0;n<3;n++) L.parts.push({t:"f", x:h[0]+(Math.random()-.5)*2*r.sc, y:h[1], vx:(Math.random()-.5)*.25, vy:-(.5+Math.random()*.9), life:0, max:.3+Math.random()*.35, sz:(1.1+Math.random()*1.3)*r.sc});
    if(Math.random()<.55) rfSpark(L, h, 1);
    if(Math.random()<.35) L.parts.push({t:"k", x:h[0], y:h[1]-2*r.sc, vx:(Math.random()-.5)*.3, vy:-(.25+Math.random()*.3), life:0, max:1.4+Math.random(), sz:5*r.sc}); }
   else { // settled: little licks of flame and the odd spark along the char
    if(Math.random() < .5){ const q = rfAt(r, Math.random()*r.L); L.parts.push({t:"f", x:q[0], y:q[1], vx:(Math.random()-.5)*.2, vy:-(.35+Math.random()*.6), life:0, max:.22+Math.random()*.3, sz:(.7+Math.random()*.9)*r.sc}); }
    if(Math.random() < .06) rfSpark(L, rfAt(r, Math.random()*r.L), .8);
    if(Math.random() < .05){ const q = rfAt(r, Math.random()*r.L); L.parts.push({t:"k", x:q[0], y:q[1]-2*r.sc, vx:(Math.random()-.5)*.25, vy:-(.2+Math.random()*.25), life:0, max:1.6+Math.random(), sz:4*r.sc}); }
   }
  });
  // particles
  const dt = 1/60, sc0 = L.runes.length ? L.runes[0].sc : 5;
  for(let i=L.parts.length-1;i>=0;i--){ const q = L.parts[i]; q.life += dt; const a = q.life/q.max; if(a>=1){ L.parts.splice(i,1); continue; }
   if(q.t==="f"){ q.vx += (Math.random()-.5)*.08; q.x += q.vx*sc0*.6; q.y += q.vy*sc0*.6; const z = q.sz*(1-a*.65);
    X.globalCompositeOperation = "lighter"; X.globalAlpha = (1-a)*(a<.15?a/.15:1); X.drawImage(RFS.flame, q.x-z, q.y-z*1.5, 2*z, 3*z); }
   else if(q.t==="s"){ q.px = q.x; q.py = q.y; q.vy += .09; q.vx *= .985; q.x += q.vx*sc0*.35; q.y += q.vy*sc0*.35;
    X.globalCompositeOperation = "lighter"; X.globalAlpha = (1-a)*(.6+.4*Math.random()); X.strokeStyle = a<.35 ? "#fff3c8" : a<.7 ? "#ffb347" : "#ff6a1e"; X.lineWidth = q.w*sc0*.28; X.beginPath(); X.moveTo(q.px,q.py); X.lineTo(q.x,q.y); X.stroke(); }
   else { q.x += q.vx*sc0*.5 + Math.sin(q.life*3+i)*.15; q.y += q.vy*sc0*.5; const z = q.sz*(1+a*2.2);
    X.globalCompositeOperation = "source-over"; X.globalAlpha = .55*Math.sin(Math.PI*a); X.drawImage(RFS.smoke, q.x-z, q.y-z, 2*z, 2*z); }
  }
